<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Báo cáo · ExamVision</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#183a35;background:#f3f6f4}*{box-sizing:border-box}body{margin:0}header{background:#102e30;color:#fff;padding:22px max(5vw,24px)}header>div{max-width:1400px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:800}.brand span{color:#8ce0bc}header a{color:#d5f4e5;text-decoration:none;font-size:14px;border:1px solid #52746b;padding:9px 14px;border-radius:8px}main{max-width:1300px;margin:auto;padding:46px 28px 80px}h1{font-size:clamp(30px,4vw,46px);letter-spacing:-1.5px;margin:0 0 10px}h2{font-size:20px;letter-spacing:-.3px;margin:0 0 8px}h3{font-size:15px;margin:0 0 6px}p{color:#687e78;line-height:1.6;margin:0}.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#62877b;font-weight:800;margin-bottom:12px}.intro{display:flex;justify-content:space-between;gap:20px;align-items:start;margin-bottom:30px}.pill{background:#d9eee5;color:#23654f;border-radius:30px;padding:9px 14px;font-size:12px;font-weight:700;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid #e0e9e5;border-radius:16px;padding:24px;box-shadow:0 8px 24px #173b2e08}.wide{grid-column:1/-1}.section-title{margin:40px 0 16px}.big{font-size:35px;font-weight:800;letter-spacing:-1.5px;margin:12px 0 3px}.muted{font-size:12px;color:#788d86}.splits{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.split{background:#f1f7f3;border-radius:8px;padding:9px 12px;font-size:12px;color:#496e60}.split b{font-size:14px;color:#173f32;margin-left:5px}.bars{display:grid;gap:16px;margin-top:25px}.barhead{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}.track{height:9px;border-radius:20px;background:#edf3ef;overflow:hidden}.fill{height:100%;border-radius:20px;background:#268d69}.note{background:#f5f8f5;border-left:3px solid #a6c7b4;padding:13px 15px;border-radius:5px;font-size:13px;margin-top:20px;line-height:1.6;color:#526d63}.alert{background:#fff8e9;border-left-color:#e0af53;color:#806337}.status{font-size:12px;border-radius:20px;padding:5px 9px;background:#e4f4ea;color:#277a50;white-space:nowrap}.status.missing{background:#fff1e9;color:#a4582e}.modelrow{display:flex;gap:15px;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid #edf2ee}.modelrow:last-child{border:0;padding-bottom:0}.modelrow p{font-size:12px;overflow-wrap:anywhere}.numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}.number{background:#f3f8f5;border-radius:10px;padding:14px}.number strong{display:block;font-size:21px}.number span{font-size:12px;color:#6b8277}.loading{padding:24px}.error{background:#fff4ec;color:#9a512d;padding:16px;border-radius:10px}.source{font-size:11px;margin-top:15px;overflow-wrap:anywhere}.links{color:#237256} @media(max-width:760px){main{padding:32px 18px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.intro{display:block}.pill{display:inline-block;margin-top:18px}.numbers{grid-template-columns:1fr 1fr}}
</style></head><body><header><div><div class="brand">◉ &nbsp;Exam<span>Vision</span></div><a href="/">← Trang kiểm thử</a></div></header><main><div class="intro"><div><div class="eyebrow">Tổng quan dự án</div><h1>Báo cáo mô hình</h1><p>Dataset, kết quả đánh giá và các mô hình đang được cấu hình trong ExamVision.</p></div><span class="pill">● &nbsp;Dữ liệu trên máy</span></div><div id="content" class="loading" role="status">Đang tải báo cáo…</div></main><script>
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const number = v => Number(v).toLocaleString('vi-VN');
const pct = v => Number.isFinite(Number(v)) ? (100*Number(v)).toLocaleString('vi-VN',{minimumFractionDigits:2,maximumFractionDigits:2})+'%' : '—';
function bars(rows){return '<div class="bars">'+rows.map(([label,value])=>`<div><div class="barhead"><span>${esc(label)}</span><b>${pct(value)}</b></div><div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,Number(value)*100||0))}%"></div></div></div>`).join('')+'</div>'}
function dataset(name, splits, source){let total=Object.values(splits).reduce((a,b)=>a+Number(b),0);return `<article class="card"><div class="eyebrow">Dataset · phiên bản 1</div><h3>${esc(name)}</h3><div class="big">${number(total)} <span style="font-size:15px;letter-spacing:0;font-weight:500">ảnh</span></div><p class="muted">Số ảnh theo phân chia được lưu trong dự án</p><div class="splits">${[['Train','train'],['Validation','valid'],['Test','test']].map(([label,key])=>`<span class="split">${label}<b>${number(splits[key])}</b></span>`).join('')}</div><p class="source">Nguồn: ${esc(source)}</p></article>`}
function render(data){let m=data.duyen, video=data.video_evaluation, snap=data.snapshots||{}, run=data.yolo_duyen_run||{}, yoloData=data.yolo_duyen_dataset||{}, out='';
out+='<div class="section-title"><div class="eyebrow">01 / Dữ liệu</div><h2>Số lượng dataset</h2><p>Ảnh train, validation và test của từng phiên bản đã lưu.</p></div><div class="grid">';
if(yoloData.splits){let s=yoloData.splits;out+=dataset('Duyên v1',{train:s.train.images,valid:s.valid.images,test:s.test.images},'reports/yolo11_duyen/dataset_summary.json')}else if(m?.split_stats){let s=m.split_stats;out+=dataset('Duyên v1',{train:s.train.images,valid:s.valid.images,test:s.test.images},'reports/knn_duyen/metrics.json')}
if(snap.graduation)out+=dataset(snap.graduation.name,snap.graduation.splits,snap.graduation.source);
out+='</div><div class="note">Đây là số liệu lưu tại máy, không tự đồng bộ với Roboflow. Hai dataset có thể trùng ảnh nên không cộng thành số ảnh duy nhất.</div>';
out+='<div class="section-title"><div class="eyebrow">02 / Kết quả</div><h2>Chỉ số đánh giá</h2><p>Mỗi nhóm chỉ số có tập dữ liệu và cách đánh giá riêng.</p></div><div class="grid">';
if(m?.test_conditional_on_matched_pose){let t=m.test_conditional_on_matched_pose,s=m.split_stats.test;out+=`<article class="card"><div class="eyebrow">KNN Duyên · test · k = ${esc(m.selected_k)}</div><h2>Phân loại trên box đã ghép</h2><p>Nhóm Cheating; accuracy tính trên cả hai lớp.</p>${bars([['Accuracy',t.accuracy],['Precision · Cheating',t.precision_cheating],['Recall · Cheating',t.recall_cheating],['F1 · Cheating',t.f1_cheating]])}<div class="numbers"><div class="number"><strong>${number(s.matched)}</strong><span>Box đã ghép</span></div><div class="number"><strong>${number(s.unmatched_ground_truth)}</strong><span>Box nhãn chưa ghép</span></div><div class="number"><strong>${pct(s.matched/s.gt)}</strong><span>Tỷ lệ ghép trên box nhãn</span></div></div><div class="note alert">Metric chỉ tính trên ${number(s.matched)} / ${number(s.gt)} box nhãn đã ghép với Pose; không đo chất lượng phát hiện trên các box chưa ghép. Các khung hình cùng nguồn có thể xuất hiện ở nhiều tập.</div><p class="source">Nguồn: reports/knn_duyen/metrics.json</p></article>`}else out+='<article class="card"><h2>KNN Duyên</h2><p>Không tìm thấy tệp metric.</p></article>';
if(video?.pooled_metrics_conditional_on_matched_pose){let v=video.pooled_metrics_conditional_on_matched_pose;out+=`<article class="card"><div class="eyebrow">KNN Duyên · kiểm tra theo nhóm video</div><h2>Đánh giá theo nguồn video</h2><p>Gộp dự đoán của ba lượt kiểm tra, mỗi lượt giữ lại một nhóm tên tệp.</p>${bars([['Accuracy',v.accuracy],['Precision · Cheating',v.precision_cheating],['Recall · Cheating',v.recall_cheating],['F1 · Cheating',v.f1_cheating]])}<div class="note alert">Các nhóm được suy ra từ tên tệp và cần xác nhận nguồn video thực tế. Kết quả chỉ tính box đã ghép; mỗi lượt dùng mô hình được huấn luyện lại, không phải phép đo trực tiếp của file KNN đang dùng trên web.</div><p class="source">Nguồn: reports/knn_duyen/video_evaluation.json</p></article>`}
if(snap.gianlan){let y=snap.gianlan;out+=`<article class="card wide"><div class="eyebrow">GIan lan · lần huấn luyện đã lưu</div><h2>YOLO detection · validation epoch ${esc(y.epoch)}</h2><p>Ảnh chụp kết quả của epoch cuối, không nhất thiết là kết quả của best.pt.</p>${bars([['Precision',y.precision],['Recall',y.recall],['mAP@50',y.map50],['mAP@50–95',y.map50_95]])}<p class="source">Nguồn: ${esc(y.source)}. Đây là số liệu đã lưu, cần cập nhật khi huấn luyện lại.</p></article>`}
if(data.yolo_duyen_test){let y=data.yolo_duyen_test;out+=`<article class="card wide"><div class="eyebrow">YOLO11 Duyên · best.pt · test</div><h2>YOLO detection · Duyên v1</h2><p>Khởi tạo ${run.mode==='scratch'?'trọng số ngẫu nhiên':run.mode==='pretrained'?'trọng số pretrained':'không rõ'}; tối đa ${esc(run.epochs??'—')} epoch, ảnh ${esc(run.imgsz??'—')} px. Đánh giá best.pt trên ${number(yoloData.splits?.test?.images??0)} ảnh test.</p>${bars([['Precision',y['metrics/precision(B)']],['Recall',y['metrics/recall(B)']],['mAP@50',y['metrics/mAP50(B)']],['mAP@50–95',y['metrics/mAP50-95(B)']]])}<p class="source">Nguồn: reports/yolo11_duyen/test_metrics.json và reports/yolo11_duyen/run_config.json. Đây là metric detection trên tập test đã lưu, không phải metric KNN.</p></article>`}
out+='</div><div class="note">Các con số thuộc những nhiệm vụ, tập dữ liệu hoặc cách chia tập khác nhau. Chưa có phép đánh giá chung cho cả năm mô hình trên một tập test độc lập; không dùng bảng này để xếp hạng mô hình.</div>';
out+='<div class="section-title"><div class="eyebrow">03 / Mô hình</div><h2>Danh sách mô hình</h2><p>Được lấy từ cấu hình máy chủ khi mở báo cáo.</p></div><div class="card">';
for(const model of data.models||[])out+=`<div class="modelrow"><div><h3>${esc(model.name)}</h3><p>${esc(model.kind)} · ${esc(model.path)}</p></div><span class="status ${model.available?'':'missing'}">${model.available?'Đủ tệp':'Thiếu tệp'}</span></div>`;
out+='</div><p class="source">Trạng thái cho biết các tệp cần thiết có tồn tại, không xác nhận mô hình tải hoặc chạy thành công. Nếu thay trọng số, cần đánh giá lại để có metric tương ứng.</p>';document.querySelector('#content').innerHTML=out;document.querySelector('#content').className=''}
fetch('/api/report').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(render).catch(()=>{document.querySelector('#content').innerHTML='<div class="error">Không thể tải báo cáo. Hãy khởi động lại máy chủ ExamVision và thử lại.</div>'});
</script></body></html>
